spring.application.name=recoverai-backend

# PostgreSQL: override these values in Render with the Neon connection settings.
# Do not put credentials in source control.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recoverai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS: comma-separated exact origins; include the deployed Vercel origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://recoverai-frontend-cyan.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Authentication. Set JWT_SECRET to at least 32 UTF-8 bytes in Render/local env.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:RecoverAI Administrator}

# Server
server.port=${PORT:8080}

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
